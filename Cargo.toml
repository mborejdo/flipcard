# flipcard: a Markdown script in, a flip-card film out. Every slide is a card drawn by Typst; the
# cards go out as an animated GIF and an MP4.
[workspace]
resolver = "3"
members = ["apps/flipcard", "packages/filmstrip", "packages/flipkit"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
authors = ["Michael Borejdo <mborejdo@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mborejdo/flipcard"
homepage = "https://github.com/mborejdo/flipcard"
# Shared from git (tags), never from crates.io.
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
tempfile = "3"
rayon = "1"
libm = "0.2"
sha2 = "0.11"

# From presiterm: the deck dialect, Markdown with colon fences, the design tokens, in-process Typst.
colonmark = { git = "https://github.com/mborejdo/presiterm", tag = "v0.2.0" }
deckmark = { git = "https://github.com/mborejdo/presiterm", tag = "v0.2.0" }
swatchbook = { git = "https://github.com/mborejdo/presiterm", tag = "v0.2.0" }
typstkit = { git = "https://github.com/mborejdo/presiterm", tag = "v0.2.0", default-features = false }

# The workspace's own crates.
filmstrip = { path = "packages/filmstrip", default-features = false }
flipkit = { path = "packages/flipkit" }

# The containers (filmstrip): the GIF and the MP4, pure Rust.
png = { version = "0.17", default-features = false }
gif = { version = "0.13", default-features = false, features = ["std"] }
color_quant = "1"
rusty_h264-encoder = "0.17"
rusty_h264-common = "0.17"
mp4 = "0.14"
bytes = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Unavoidable with many transitive deps (the Typst stack trails ours in many crates).
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
# No required `# Errors` / `# Panics` sections, no doc-paragraph length limit.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_long_first_doc_paragraph = "allow"
# Contradicts rustc `unreachable_pub`, which is kept.
redundant_pub_crate = "allow"
# Stricter than the groups: no panicking shortcuts or stray output in library code (tests are
# exempt, see clippy.toml), and every `#[allow]` says why.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
