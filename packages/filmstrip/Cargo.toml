[package]
name = "filmstrip"
description = "Frames in, films out: RGB frames to a delta-frame GIF, a pure-Rust H.264 MP4."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["gif", "mp4", "h264", "video", "animation"]
categories = ["multimedia::encoding", "multimedia::video"]

[lints]
workspace = true

[features]
default = ["gif"]
# The animated GIF: one learned palette, delta frames.
gif = ["dep:gif", "dep:color_quant"]
# H.264 in an MP4 container, pure Rust.
mp4 = ["dep:rusty_h264-encoder", "dep:rusty_h264-common", "dep:mp4", "dep:bytes"]
# `Transition` by name in a config file.
serde = ["dep:serde"]

[dependencies]
anyhow.workspace = true
libm.workspace = true
png.workspace = true
serde = { workspace = true, optional = true }
gif = { workspace = true, optional = true }
color_quant = { workspace = true, optional = true }
rusty_h264-encoder = { workspace = true, optional = true }
rusty_h264-common = { workspace = true, optional = true }
mp4 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
