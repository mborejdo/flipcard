[package]
name = "flipkit"
description = "A Markdown deck as a flip-card film: a Typst card per slide, a build-in per key press, out as GIF, MP4, DOCX and PDF."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["gif", "mp4", "slides", "typst", "animation"]
categories = ["multimedia::encoding", "rendering"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
colonmark.workspace = true
deckmark.workspace = true
filmstrip = { workspace = true, features = ["gif", "mp4", "docx", "pdf", "serde"] }
libm.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
swatchbook.workspace = true
toml.workspace = true
typstkit = { workspace = true, default-features = false, features = ["packages", "pdf"] }

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
